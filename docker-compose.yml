services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic-postgres
    environment:
      POSTGRES_DB: clinic_management
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: clinic-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      # ⚠️ `curl`, not `wget`: the minio/minio image ships no `wget`, so this probe answered
      # « /bin/sh: wget: command not found » on every run — 4 748 consecutive failures, the container
      # permanently `unhealthy` while MinIO itself was fine. A probe that can never pass is worse than none:
      # a `depends_on: { condition: service_healthy }` on it would hang for ever, and a real outage was
      # indistinguishable from the standing red. `curl` and `mc` are both present in the image; `curl -f`
      # already exits non-zero on an HTTP error, so no `|| exit 1` is needed.
      test: ["CMD-SHELL", "curl -f -s http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # LOCAL DEV ONLY. A mail sink so transactional email (clinic self-signup's verification link) can be
  # exercised without a real relay: SMTP on 1025 accepts anything, the web UI on 8025 shows what arrived.
  # Nothing in the product knows about it — it is pointed at by Notification:Smtp:* in
  # appsettings.Development.json, the same keys a real deployment fills in.
  mailpit:
    image: axllent/mailpit:latest
    container_name: clinic-mailpit
    ports:
      - "1025:1025"  # SMTP submission
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 3


volumes:
  postgres_data:
  minio_data:


