services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic-postgres
    environment:
      POSTGRES_DB: clinic_management
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: clinic-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  # LOCAL DEV ONLY. A mail sink so transactional email (clinic self-signup's verification link) can be
  # exercised without a real relay: SMTP on 1025 accepts anything, the web UI on 8025 shows what arrived.
  # Nothing in the product knows about it — it is pointed at by Notification:Smtp:* in
  # appsettings.Development.json, the same keys a real deployment fills in.
  mailpit:
    image: axllent/mailpit:latest
    container_name: clinic-mailpit
    ports:
      - "1025:1025"  # SMTP submission
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 3


volumes:
  postgres_data:
  minio_data:


