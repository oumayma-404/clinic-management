# The Xcode project as a reviewable text file.
#
# ⚠️ **`ClinicShell.xcodeproj` is generated, never committed.** An `.xcodeproj` is a directory of machine-written
# XML with UUID cross-references: it cannot be reviewed in a diff, it conflicts on every concurrent edit, and — the
# reason that decides it here — it can only be *authored* by Xcode, which needs a Mac this project does not have.
# XcodeGen turns this file into one on the CI runner, so the whole project is editable from Windows.
#
# The version below is the single source of the shell's version, exactly as `versionName` is on Android:
# MARKETING_VERSION reaches `window.__clinicShell.version` and therefore `X-Client-Version`. A change to the
# bridge's method set edits `mobile/shared/bridge.md` AND bumps it.

name: ClinicShell

options:
  bundleIdPrefix: com.clinicmanagement
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"

targets:
  ClinicShell:
    type: application
    platform: iOS
    sources:
      - path: ClinicShell
        excludes:
          - Info.plist
    settings:
      base:
        # SETTLED. It must stay in step with Android's `applicationId`, and it cannot be changed after the first
        # store submission — see `mobile/ios/README.md` § « Avant la première soumission ».
        PRODUCT_BUNDLE_IDENTIFIER: com.clinicmanagement.shell
        INFOPLIST_FILE: ClinicShell/Info.plist
        # The 1024×1024 in `ClinicShell/Assets.xcassets/AppIcon.appiconset`, generated from the one master by
        # `web/scripts/generate-icons.mjs`. ⚠️ Naming the set is required: without this setting Xcode compiles the
        # catalog and ships an app with **no** icon — a build that succeeds and a home screen showing a white
        # square, which is exactly the failure mode nobody notices until the first TestFlight install.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # Free CI has no signing identity and needs none: the artifact is an unsigned .app that Sideloadly signs
        # on the operator's own machine with their free Apple ID. See the README.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
