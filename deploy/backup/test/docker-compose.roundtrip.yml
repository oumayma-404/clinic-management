# The backup round trip, end to end, on fake data — driven by ./roundtrip.sh, never brought up by hand.
#
# A real TLS PostgreSQL and a real TLS MinIO (the production certs one-shot and pg_hba), a second plain MinIO
# standing in for the off-site bucket, and the production backup image. Nothing here publishes a port, sets a
# container_name or tags an image with a production name, so it cannot collide with a dev stack on the same
# machine: every name is prefixed by the project roundtrip.sh passes (`-p backup-roundtrip`).
#
# ⚠️ Fake data only. The database rows and the objects are generated by roundtrip.sh; no dump of a real
# deployment ever belongs here.

# WAL-G's environment, exactly as docker-compose.prod.yml maps it (WALG_S3_* in .env → AWS_* for wal-g), pointed
# at the « off-site » MinIO. The libsodium key is a test value: 32 bytes, as wal-g requires.
x-walg: &walg
  WALG_S3_PREFIX: s3://pitr/hosted
  AWS_ENDPOINT: http://offsite:9000
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: offsite
  AWS_SECRET_ACCESS_KEY: offsite-only
  AWS_S3_FORCE_PATH_STYLE: "true"
  WALG_LIBSODIUM_KEY: roundtrip-only-libsodium-key-32b

services:
  certs:
    build:
      context: ../../certs
    restart: "no"
    volumes:
      - internal_certs:/certs

  # The production server: deploy/postgres (postgres:16 + wal-g), TLS on the internal leaf, the hostssl-only
  # pg_hba baked into that image, and WAL archiving through wal-push-guard.sh — the same command line as
  # docker-compose.prod.yml, so backup.sh's « is this hop encrypted? » check and the PITR stream are both real.
  postgres:
    build:
      context: ../../postgres
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/wal-push-guard.sh %p
      - -c
      - archive_timeout=60
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/postgres/server.crt
      - -c
      - ssl_key_file=/certs/postgres/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      <<: *walg
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: roundtrip-only
    volumes:
      - pg_source:/var/lib/postgresql/data
      - internal_certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The object store being backed up, on TLS like production (the leaf's SAN is `minio`).
  minio:
    image: minio/minio:latest
    depends_on:
      certs:
        condition: service_completed_successfully
    command: server /data --certs-dir /certs/minio
    environment:
      MINIO_ROOT_USER: roundtrip
      MINIO_ROOT_PASSWORD: roundtrip-only
    volumes:
      - minio_source:/data
      - internal_certs:/certs:ro

  # The « off-site » bucket. Plain HTTP: it stands in for a provider, and what crosses to it is age ciphertext.
  offsite:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: offsite
      MINIO_ROOT_PASSWORD: offsite-only
    volumes:
      - offsite_data:/data

  # The production backup image, configured the way docker-compose.prod.yml + hosted.yml configure it.
  backup:
    build:
      context: ..
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: clinic
      PGUSER: clinic
      PGPASSWORD: roundtrip-only
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /certs/ca.crt
      BACKUP_REMOTE: ${ROUNDTRIP_REMOTE:-offsite:backups/hosted}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: Minio
      RCLONE_CONFIG_OFFSITE_ENDPOINT: http://offsite:9000
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: offsite
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: offsite-only
      RCLONE_CONFIG_OFFSITE_FORCE_PATH_STYLE: "true"
      BACKUP_STATUS_DIR: /status
      BACKUP_AGE_RECIPIENT: ${ROUNDTRIP_AGE_RECIPIENT:-}
      BACKUP_RETENTION_DAYS: "14"
      KEYRING_MARKER_FILE: /keyring-marker/generation
      KEYRING_DIR: ${ROUNDTRIP_KEYRING_DIR:-/keyring}
    volumes:
      - minio_source:/minio-data:ro
      - backups:/backups
      - internal_certs:/certs:ro
      - keyring_marker:/keyring-marker:ro
      - keyring:/keyring:ro
      - backup_status:/status
      # Test-only: the age identity, the original objects and the drill output. Never mounted in production.
      - fixtures:/fixtures
      - drill:/drill

  # The test's own hands: the same image (rclone, age, psql, pg_restore), every volume read-write, no
  # entrypoint. Writes the fixtures, loads the drill's output back and reads it out again.
  tool:
    build:
      context: ..
    entrypoint: ["sh", "-c"]
    environment:
      RCLONE_CONFIG_SRC_TYPE: s3
      RCLONE_CONFIG_SRC_PROVIDER: Minio
      RCLONE_CONFIG_SRC_ENDPOINT: https://minio:9000
      RCLONE_CONFIG_SRC_ACCESS_KEY_ID: roundtrip
      RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: roundtrip-only
      RCLONE_CONFIG_SRC_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: Minio
      RCLONE_CONFIG_OFFSITE_ENDPOINT: http://offsite:9000
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: offsite
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: offsite-only
      RCLONE_CONFIG_OFFSITE_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_RESTORED_TYPE: s3
      RCLONE_CONFIG_RESTORED_PROVIDER: Minio
      RCLONE_CONFIG_RESTORED_ENDPOINT: http://minio-restored:9000
      RCLONE_CONFIG_RESTORED_ACCESS_KEY_ID: roundtrip
      RCLONE_CONFIG_RESTORED_SECRET_ACCESS_KEY: roundtrip-only
      RCLONE_CONFIG_RESTORED_FORCE_PATH_STYLE: "true"
      PGPASSWORD: roundtrip-only
    volumes:
      - internal_certs:/certs:ro
      - backups:/backups
      - keyring_marker:/keyring-marker
      - keyring:/keyring
      - backup_status:/status
      - fixtures:/fixtures
      - drill:/drill
      - minio_restored:/minio-restored

  # The PITR sidecar's base backup, as docker-compose.prod.yml's `pitr` runs it (TLS hop, data dir read-only).
  pitr:
    build:
      context: ../../postgres
    entrypoint: ["/usr/local/bin/pitr-backup.sh"]
    environment:
      <<: *walg
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: clinic
      PGPASSWORD: roundtrip-only
      PGDATABASE: clinic
      PGDATA: /var/lib/postgresql/data
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /certs/ca.crt
      PITR_RETAIN_BASE_BACKUPS: "7"
    volumes:
      - pg_source:/var/lib/postgresql/data:ro
      - internal_certs:/certs:ro

  # A server rebuilt from the PITR stream alone — RESTORE-DRILL.md path B, step for step: base backup fetched
  # into an empty volume, then WAL replayed from the off-site bucket until it runs out, then promoted.
  postgres-pitr-restored:
    build:
      context: ../../postgres
    environment:
      <<: *walg
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: roundtrip-only
    volumes:
      - pitr_restored:/var/lib/postgresql/data

  # Where the drill's output is loaded back, to prove it restores — plain, throwaway.
  postgres-restored:
    image: postgres:16
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: roundtrip-only
    volumes:
      - pg_restored:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-restored:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: roundtrip
      MINIO_ROOT_PASSWORD: roundtrip-only
    volumes:
      - minio_restored:/data

volumes:
  internal_certs:
  pg_source:
  minio_source:
  offsite_data:
  backups:
  keyring_marker:
  keyring:
  backup_status:
  fixtures:
  drill:
  pg_restored:
  minio_restored:
  pitr_restored:
