# The server's own refusal of cleartext (hosted-security-hardening Part 2, FR-2.3).
#
# ⚠️ THERE IS NO `host` LINE IN THIS FILE, AND THAT ABSENCE IS THE FEATURE. `hostssl` matches only a
# connection that has already negotiated TLS, so a cleartext TCP client finds no matching entry and is
# refused BY THE SERVER — "no pg_hba.conf entry for host …, no encryption". Without that, the application's
# own `sslmode=verify-full` is a courtesy: anything else on the container network (a stray sidecar, a shell
# in another container, a compromised process) still connects in the clear and nothing says so.
#
# ⚠️ Reached through `-c hba_file=` in both compose files' postgres `command:`, NOT by overwriting
# $PGDATA/pg_hba.conf. initdb writes that file on first boot and would win on a volume created before this
# change; pointing the server at an image path means the rule is a property of the image and cannot be
# edited away on a live host. It also survives `docker compose down -v`.
#
# The `local` lines are the unix socket inside the container: the image's own entrypoint, `pg_isready`
# (the healthcheck) and `psql` for an operator already exec'd in. TLS over a socket is meaningless, and
# reaching that socket already requires being inside the container.

# TYPE      DATABASE     USER   ADDRESS       METHOD
local       all          all                  trust
local       replication  all                  trust

hostssl     all          all    0.0.0.0/0     scram-sha-256
hostssl     all          all    ::/0          scram-sha-256

# The pitr sidecar's `wal-g backup-push` brackets its copy with pg_backup_start/stop over an ordinary
# connection, and a physical base backup may use a replication one — both over TCP, both TLS-only here.
hostssl     replication  all    0.0.0.0/0     scram-sha-256
hostssl     replication  all    ::/0          scram-sha-256
