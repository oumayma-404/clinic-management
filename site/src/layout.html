<!-- The mark on its gradient plate, inline so the page needs no extra request. A data: URI
     cannot include a partial, so this is a hand-kept copy of src/partials/mark.html's path;
     the two must move together and this comment is the only thing that says so. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' gradientUnits='userSpaceOnUse' x1='0' y1='0' x2='512' y2='512'%3E%3Cstop offset='0' stop-color='%231B54CE'/%3E%3Cstop offset='.5' stop-color='%231E86DC'/%3E%3Cstop offset='1' stop-color='%232FC6E0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23g)'/%3E%3Cpath d='M126.15 373.14L256 79.93L385.85 373.14L348.36 389.74L256 181.2L163.65 389.74Z' fill='%23fff'/%3E%3C/svg%3E">

<meta property="og:type" content="website">
<meta property="og:locale" content="fr_TN">
<meta property="og:site_name" content="APEXA">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{BASE}}{{PATH}}">
<!-- ⚠️ An ABSOLUTE url, and a JPEG. A relative og:image is ignored by most
     scrapers, and a WebP one does not render in WhatsApp. -->
<meta property="og:image" content="{{BASE}}assets/img/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
