<!doctype html>
<html lang="fr" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#295AA8">
<!-- ⚠️ {{CANON}} et non le chemin du fichier : l'accueil est canonique à `/`, pas à
     `/index.html`, que GitHub Pages sert aussi en 200. build.mjs § canonOf. -->
<link rel="canonical" href="{{BASE}}{{CANON}}">
<!-- ⚠️ REAL FILES, never a data: URI. Google showed a blank globe beside apexa.tn in its results
     because the only icon was an inline data: URI, which browsers take and Google's favicon crawler does
     not: it wants a crawlable file whose side is a multiple of 48 px. The files are generated from the
     one logo master by web/scripts/generate-icons.mjs into src/icons/, and build.mjs puts them at the
     site root — /favicon.ico is also the path Google and every browser ask for unprompted. -->
<link rel="icon" href="{{ROOT}}favicon.ico" sizes="48x48">
<link rel="icon" href="{{ROOT}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{ROOT}}icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="{{ROOT}}apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:locale" content="fr_TN">
<meta property="og:site_name" content="APEXA">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{BASE}}{{CANON}}">
<!-- ⚠️ An ABSOLUTE url, and a JPEG. A relative og:image is ignored by most
     scrapers, and a WebP one does not render in WhatsApp. -->
<meta property="og:image" content="{{BASE}}assets/img/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ROOT}}assets/site.css">

<!-- Données structurées : src/jsonld/<page>.json, vide si le fichier n'existe pas. -->
{{JSONLD}}
</head>
<body class="{{BODYCLASS}}">

<a class="skip" href="#main">Aller au contenu</a>
<div id="top-sentinel" aria-hidden="true" style="position:absolute;top:0;height:1px;width:1px"></div>

{{NAV}}

<main id="main">
{{BODY}}
</main>

{{FOOTER}}

<script src="{{ROOT}}assets/site.js" defer></script>
</body>
</html>
