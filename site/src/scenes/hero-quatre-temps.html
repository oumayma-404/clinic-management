<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quatre temps</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   « QUATRE TEMPS » — hero scene, 17.5 s seamless loop: an APEXA end card,
   then 4 acts of 3.5 s.

   ⚠️ THE LOOP OPENS AND CLOSES ON THE LOGO, and those are the same instant.
   0 % IS 100 %, so one end card serves as both. It sits at the HEAD: the film
   opens by DRAWING the lockup — the Λ rises, the letters track outward, a
   reflection crosses — holds it, dissolves into the agenda, plays the four
   acts, and closes with the plate fading back over act 4's exit, straight
   into the next build. Opening on an already-assembled logo was the first
   cut of this and it read as a film that had already finished.

   The logo owns 0 %–20 % (3.5 s) and the acts own 20 %–100 % (14 s, their
   original pacing to the millisecond). Every act track holds its final value
   across 0 %–20 % — a still frame, under an opaque plate, for as long as the
   build runs. That hold is why nothing about the four acts had to be
   re-timed: their percentages are the originals × 0.8, rotated +20 %.

   ONE master duration. Every animated element runs `--T` (17.5s) infinite, with
   keyframes expressed in % of the whole loop, so nothing can drift and 100%
   is authored identical to 0%. Sibling stagger is done with NEGATIVE delays
   only (`--d` = "starts this many ms earlier"): a positive delay would leave
   an element mid-cycle at the seam.

   Only transform / opacity / clip-path are animated. Nothing here touches
   layout on a frame.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --ink:      #295AA8;
  --ink-2:    #3067BC;
  --ink-3:    #3672CB;
  --rule-ink: #5382CA;

  --on-ink:       #ffffff;
  --on-ink-muted: #C7D6F0;
  --on-ink-faint: #A8BCE0;

  --paper:      #ffffff;
  --text:       #09090b;
  --text-muted: #52525b;
  --rule:       #e4e4e3;

  --accent:     #2FC6E0;
  --accent-lit: #9CE6F6;
  --on-accent:  #04222a;

  --azure:  #0284c7;  --azure-lit:  #7dd0fb;
  --violet: #7c3aed;  --violet-lit: #c4aeff;
  --amber:  #b45309;  --amber-lit:  #fbc76a;
  --green:  #047857;  --green-lit:  #6ee7b7;

  --sans: "Geist", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;

  --ease-out:    cubic-bezier(.23, 1, .32, 1);
  --ease-in-out: cubic-bezier(.77, 0, .175, 1);

  --T: 17.5s;
  --r-card: 20px;
  --r-med:  12px;
  --r-sm:   10px;
}

*, *::before, *::after { box-sizing: border-box; }

/* ── The card the whole film lives in ──────────────────────────────────── */
.film {
  position: relative;
  margin: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--rule-ink);
  border-radius: var(--r-card);
  background: var(--ink);
  container: film / inline-size;
  font-family: var(--sans);
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}

/* ── The stage: a fixed-proportion box that IS the container query root.
   Everything inside is sized in `em`, and the stage sets 1em ≈ 10 design px
   at the reference width, so a 14 px label stays a 14 px label on a phone
   instead of shrinking to 7 px with the box. ───────────────────────────── */
.stage {
  position: relative;
  container: stage / inline-size;
  aspect-ratio: 64 / 44;
  overflow: hidden;
}
.world {
  position: absolute;
  inset: 0;
  font-size: calc(100cqw / 64);   /* 640 design px wide → 1em = 10px */
  line-height: 1.25;
  color: var(--on-ink);
}

/* ── Four glows, one per act, cross-faded. The ground changes temperature
   with the chapter without any colour being animated. ──────────────────── */
.glow {
  position: absolute;
  inset: -20% -10% auto -10%;
  height: 90%;
  opacity: 0;
  animation: glowLife var(--T) linear infinite both;
}
.glow-1 { background: radial-gradient(58% 62% at 74% 8%, color-mix(in oklab, var(--azure)  46%, transparent), transparent 72%); }
.glow-2 { background: radial-gradient(58% 62% at 50% 6%, color-mix(in oklab, var(--violet) 44%, transparent), transparent 72%); }
.glow-3 { background: radial-gradient(58% 62% at 34% 8%, color-mix(in oklab, var(--amber)  40%, transparent), transparent 72%); }
.glow-4 { background: radial-gradient(62% 66% at 62% 10%, color-mix(in oklab, var(--accent) 34%, transparent), transparent 72%); }
.grain {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgb(14 27 42 / 0) 55%, rgb(14 27 42 / .55) 100%);
  pointer-events: none;
}

/* ── The HUD. Deliberately NOT scaled with the stage: it is the page's own
   type, in rem, so the caption is legible at 342 px. ───────────────────── */
.hud {
  position: relative;
  padding: .8125rem clamp(.875rem, 3cqw, 1.375rem) clamp(.875rem, 2.4cqw, 1.125rem);
  border-top: 1px solid var(--rule-ink);
  background: var(--ink);
}
.caption {
  position: relative;
  height: 1.6rem;
  margin-bottom: .75rem;
}
.caption span {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: .5rem;
  font-size: clamp(.9375rem, .82rem + .5cqw, 1.0625rem);
  letter-spacing: -.005em;
  color: var(--on-ink);
  white-space: nowrap;
  opacity: 0;
  animation: capLife var(--T) var(--ease-out) infinite both;
}
.caption i {
  flex: none;
  width: .4375rem; height: .4375rem;
  border-radius: 50%;
  background: var(--zc, var(--accent));
}
.caption b { font-weight: 400; }
.caption em {
  font-style: normal;
  color: var(--on-ink-faint);
  font-size: .8125em;
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-left: .125rem;
}
.rail { display: flex; gap: .3125rem; }
.rail > i {
  position: relative;
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: rgb(255 255 255 / .11);
  overflow: hidden;
}
.rail > i::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: 2px;
  background: var(--zc);
  transform: scaleX(0);
  transform-origin: left center;
  animation: railFill var(--T) linear infinite both;
}
.rail > i:nth-child(1) { --zc: var(--azure-lit);  }
.rail > i:nth-child(2) { --zc: var(--violet-lit); }
.rail > i:nth-child(3) { --zc: var(--amber-lit);  }
.rail > i:nth-child(4) { --zc: var(--accent-lit); }
.rail > i:nth-child(1)::after { animation-name: railFill1; }
.rail > i:nth-child(2)::after { animation-name: railFill2; }
.rail > i:nth-child(3)::after { animation-name: railFill3; }
.rail > i:nth-child(4)::after { animation-name: railFill4; }

/* one phrase, two lengths: the long one wraps on a phone and the short one
   says the same thing. */
.only-wide { display: inline }
.only-narrow { display: none }

.sr {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* ── Shared act scaffolding ────────────────────────────────────────────── */
.act { position: absolute; inset: 0; padding: 2.2em; display: flex; flex-direction: column; }
.act-2, .act-3, .act-4 { align-items: center; justify-content: center; }
/* No will-change: Chrome already runs an active transform/opacity animation on
   the compositor, and promoting ~100 elements by hand costs memory for nothing. */
.anim { animation-duration: var(--T); animation-iteration-count: infinite; animation-fill-mode: both; animation-delay: calc(var(--d, 0) * -1ms); }

/* ══ ACT 1 · L'agenda ═════════════════════════════════════════════════════ */
.day {
  display: flex; align-items: baseline; gap: .8em;
  margin-bottom: 1.5em;
  opacity: 0;
  animation-name: dayIn; animation-timing-function: var(--ease-out);
}
.day b { font-weight: 400; font-size: 1.5em; letter-spacing: -.01em; }
.day s { text-decoration: none; color: var(--on-ink-faint); font-size: 1.15em; }
.day u {
  text-decoration: none; margin-left: auto;
  font-size: 1.05em; letter-spacing: .07em; text-transform: uppercase;
  color: var(--azure-lit);
}

.grid { display: flex; flex-direction: column; justify-content: center; flex: 1; gap: .8em; }
.row { display: grid; grid-template-columns: 4.6em 1fr; align-items: stretch; gap: .9em; }

.hh {
  display: flex; align-items: center; justify-content: flex-end;
  font-size: 1.2em; color: var(--on-ink-faint);
  font-variant-numeric: tabular-nums;
  opacity: 0;
  animation-name: hhIn; animation-timing-function: var(--ease-out);
}

.blk {
  position: relative;
  height: 5em;
  display: flex; align-items: center; gap: .9em;
  padding: 0 1.1em 0 1.5em;
  border: 1px solid var(--rule-ink);
  border-radius: var(--r-med);
  background: var(--ink-2);
  overflow: hidden;
  opacity: 0;
  animation-name: blkIn; animation-timing-function: var(--ease-out);
}
/* the colour arrives as a tint that sweeps across, not as a repaint */
.blk::before {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(90deg,
    color-mix(in oklab, var(--zt, var(--zc)) 20%, transparent),
    color-mix(in oklab, var(--zt, var(--zc)) 5%, transparent) 62%,
    transparent);
  transform: scaleX(0); transform-origin: left center;
  animation: tintIn var(--T) var(--ease-out) infinite;
  animation-delay: calc(var(--d, 0) * -1ms);
}
.blk::after {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0;
  width: .34em;
  background: var(--zc);
  transform: scaleY(0); transform-origin: center;
  animation: barIn var(--T) var(--ease-out) infinite;
  animation-delay: calc(var(--d, 0) * -1ms);
}
.blk-t { position: relative; min-width: 0; }
.blk-t b { display: block; font-weight: 400; font-size: 1.4em; letter-spacing: -.005em; white-space: nowrap; }
.blk-t s { display: block; text-decoration: none; font-size: 1.1em; color: var(--on-ink-muted); margin-top: .15em; white-space: nowrap; }
.blk-f {
  position: relative; margin-left: auto; flex: none;
  font-size: 1.05em; color: var(--on-ink-faint);
  padding: .3em .7em;
  border: 1px solid var(--rule-ink); border-radius: 999px;
  white-space: nowrap;
}
.blk-d {
  position: relative; flex: none;
  width: .8em; height: .8em; border-radius: 50%;
  background: var(--zc);
  transform: scale(0);
  animation: dotIn var(--T) var(--ease-out) infinite;
  animation-delay: calc(var(--d, 0) * -1ms);
}
/* the selection ring on the block act 2 opens */
.pick {
  position: absolute; inset: -1px;
  border: 1.5px solid var(--violet-lit);
  border-radius: var(--r-med);
  opacity: 0;
  animation: pickIn var(--T) var(--ease-out) infinite;
}

/* ══ ACT 2 · La fiche patient ═════════════════════════════════════════════ */
.card {
  position: relative;
  width: 100%;
  max-width: 50em;
  padding: 2em 2.2em 2.1em;
  border-radius: var(--r-card);
  background: var(--paper);
  color: var(--text);
  box-shadow: 0 2px 8px rgb(9 9 11 / .18), 0 30px 70px -30px rgb(0 0 0 / .75);
  opacity: 0;
  animation-name: cardIn; animation-timing-function: var(--ease-out);
}
/* .fh / .hr / .lbl carry no animation of their own: they arrive with the card,
   so a white surface is never on screen empty. Only the chart, the line and
   the stats stagger. Same rule for .sh on the note. */
.fh { display: flex; align-items: center; gap: 1.1em; }
.av {
  flex: none; width: 3.6em; height: 3.6em; border-radius: 50%;
  display: grid; place-items: center;
  background: color-mix(in oklab, var(--violet) 12%, #ffffff);
  color: var(--violet);
  font-size: 1em; letter-spacing: .04em;
}
.av b { font-weight: 400; font-size: 1.35em; }
.fh-t b { display: block; font-weight: 400; font-size: 1.9em; letter-spacing: -.015em; }
.fh-t s { display: block; text-decoration: none; font-size: 1.15em; color: var(--text-muted); margin-top: .1em; }
.zchip {
  margin-left: auto; flex: none;
  font-size: 1.05em; letter-spacing: .07em; text-transform: uppercase;
  padding: .45em .85em; border-radius: 999px;
  background: color-mix(in oklab, var(--zc) 12%, #ffffff);
  color: var(--zc);
}
.hr { height: 1px; background: var(--rule); margin: 1.5em 0 1.3em; }
.lbl { font-size: 1em; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }

.arch { margin-top: .85em; display: flex; flex-direction: column; gap: .4em; }
.arch-r { display: grid; grid-template-columns: repeat(16, 1fr); gap: .34em; }
.arch-r i {
  position: relative;
  aspect-ratio: 4 / 5;
  border-radius: .35em .35em .5em .5em;
  background: #edede9;
  box-shadow: inset 0 0 0 1px #dededa;
  transform: translateY(.6em) scale(.86);
  opacity: 0;
  animation: toothIn var(--T) var(--ease-out) infinite;
  animation-delay: calc(var(--d, 0) * -1ms);
}
.arch-r > :nth-child(9) { margin-left: .55em }
.arch-n > :nth-child(9) { margin-left: .55em }
.arch-r i.old { background: #d4d4ce; box-shadow: inset 0 0 0 1px #c6c6bf; }
/* the act being recorded: dent 26 */
.arch-r i.now::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  background: var(--violet);
  box-shadow: 0 0 0 2px color-mix(in oklab, var(--violet) 26%, transparent);
  transform: scale(0);
  animation: nowIn var(--T) var(--ease-out) infinite;
}
.arch-n {
  display: grid; grid-template-columns: repeat(16, 1fr); gap: .34em;
  margin-top: -.15em;
  font-size: .85em; color: #a1a1aa; text-align: center;
  font-variant-numeric: tabular-nums;
  opacity: 0;
  animation-name: metaIn; animation-timing-function: var(--ease-out);
}

.fline {
  display: flex; align-items: center; gap: .7em;
  margin-top: 1.5em;
  font-size: 1.25em;
  opacity: 0;
  animation-name: metaIn; animation-timing-function: var(--ease-out);
}
.fline i { flex: none; width: .7em; height: .7em; border-radius: 50%; background: var(--violet); }
.fline u { text-decoration: none; margin-left: auto; display: inline-flex; align-items: center; gap: .35em; color: var(--text-muted); font-size: .88em; }
.tick { flex: none; width: 1.05em; height: 1.05em; }
.tick path { stroke: var(--accent); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.fstats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1em;
  margin-top: 1.4em; padding-top: 1.3em; border-top: 1px solid var(--rule);
}
.fstats s { display: block; text-decoration: none; font-size: .95em; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); }
.fstats b { display: block; font-weight: 400; font-size: 1.4em; margin-top: .2em; font-variant-numeric: tabular-nums; }

/* ══ ACT 3 · La note d'honoraires ═════════════════════════════════════════ */
.sheet {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 44em;
  padding: 2em 2.2em 1.9em;
  border-radius: var(--r-card);
  background: var(--paper);
  color: var(--text);
  box-shadow: 0 2px 8px rgb(9 9 11 / .18), 0 30px 70px -30px rgb(0 0 0 / .75);
  opacity: 0;
  animation-name: sheetIn; animation-timing-function: var(--ease-out);
}
.sheet::before {
  content: "";
  position: absolute; left: 0; right: 0; top: 0; height: 3px;
  border-radius: var(--r-card) var(--r-card) 0 0;
  background: var(--amber);
  transform: scaleX(0); transform-origin: left center;
  animation: sheetBar var(--T) var(--ease-out) infinite;
}
.sh { display: flex; align-items: flex-start; gap: 1em; }
.sh b { font-weight: 400; font-size: 1.9em; letter-spacing: -.015em; }
.sh s { display: block; text-decoration: none; font-size: 1.15em; color: var(--text-muted); margin-top: .25em; }
.sh u {
  text-decoration: none; margin-left: auto; flex: none; text-align: right;
  font-size: 1.05em; color: var(--text-muted); font-variant-numeric: tabular-nums;
}
.sh u em { display: block; font-style: normal; font-size: .9em; letter-spacing: .07em; text-transform: uppercase; color: #a1a1aa; }

.lines { margin-top: .3em; }
.li {
  display: flex; align-items: baseline; gap: 1em;
  padding: .95em 0;
  border-bottom: 1px solid var(--rule);
  font-size: 1.3em;
  clip-path: inset(0 100% 0 0);
  opacity: 0;
  animation-name: lineWrite; animation-timing-function: var(--ease-out);
}
.li s { text-decoration: none; }
.li em { font-style: normal; color: #a1a1aa; font-size: .82em; letter-spacing: .05em; }
.li b {
  margin-left: auto; font-weight: 400; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.tot {
  display: flex; align-items: baseline; gap: 1em;
  margin-top: 1.2em;
  opacity: 0;
  animation-name: totIn; animation-timing-function: var(--ease-out);
}
.tot s { text-decoration: none; font-size: 1.15em; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.tot b {
  margin-left: auto; font-weight: 400; font-size: 2.5em; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.sfoot {
  display: flex; align-items: center; gap: .55em;
  margin-top: 1.3em; padding-top: 1.2em; border-top: 1px solid var(--rule);
  font-size: 1.15em; color: var(--text-muted);
  opacity: 0;
  animation-name: sfootIn; animation-timing-function: var(--ease-out);
}

/* ══ ACT 4 · La caisse ════════════════════════════════════════════════════ */
.till {
  position: relative;
  width: 100%;
  max-width: 46em;
  padding: 1.9em 2.1em 1.8em;
  border: 1px solid var(--rule-ink);
  border-radius: var(--r-card);
  background: linear-gradient(180deg, var(--ink-3), var(--ink-2) 62%);
  box-shadow: 0 30px 70px -34px rgb(0 0 0 / .8);
  opacity: 0;
  animation-name: tillIn; animation-timing-function: var(--ease-out);
}
.th { display: flex; align-items: flex-end; gap: 1em; }
.th s { text-decoration: none; font-size: 1.05em; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-lit); }
.th em { display: block; font-style: normal; font-size: 1.15em; color: var(--on-ink-faint); margin-top: .3em; }
.th u { text-decoration: none; margin-left: auto; font-size: 1.05em; color: var(--on-ink-faint); }

.sum {
  display: flex; align-items: baseline; gap: .12em;
  margin-top: .55em;
  font-size: 3.4em; letter-spacing: -.025em;
  font-variant-numeric: tabular-nums;
  opacity: 0;
  animation-name: sumIn; animation-timing-function: var(--ease-out);
}
.sum b { font-weight: 400 }
.sum .dt { font-size: .42em; letter-spacing: .02em; color: var(--on-ink-muted); margin-left: .5em; }
/* the odometer: a strip of digits translated, never a repaint */
.od { display: inline-block; height: 1.12em; overflow: hidden; vertical-align: baseline; }
.od > span {
  display: block;
  transform: translateY(calc(var(--from) * -1.12em));
  animation: roll var(--T) var(--ease-out) infinite;
  animation-delay: calc(var(--d, 0) * -1ms);
}
.od > span > b { display: block; height: 1.12em; line-height: 1.12em; font-weight: 400; }

.mv { margin-top: 1.5em; padding-top: 1.2em; border-top: 1px solid var(--rule-ink); }
.mv-h { font-size: 1.02em; letter-spacing: .08em; text-transform: uppercase; color: var(--on-ink-faint); }
.mv-r {
  position: relative;
  display: flex; align-items: center; gap: .8em;
  margin-top: .85em;
  padding: .62em .8em;
  border-radius: var(--r-sm);
  font-size: 1.2em;
  opacity: 0;
  animation-name: mvIn; animation-timing-function: var(--ease-out);
}
.mv-r i { flex: none; width: .62em; height: .62em; border-radius: 50%; background: var(--zc, var(--on-ink-faint)); }
.mv-r s { text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mv-r em { font-style: normal; color: var(--on-ink-faint); font-size: .88em; }
.mv-r b { margin-left: auto; font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mv-r.hot { background: color-mix(in oklab, var(--amber-lit) 13%, transparent); }
.mv-r.hot::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: var(--r-sm);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--amber-lit) 42%, transparent);
  transform: scaleX(.4); transform-origin: right center;
  opacity: 0;
  animation: hotIn var(--T) var(--ease-out) infinite;
}
.enc {
  flex: none; font-size: .8em; letter-spacing: .06em; text-transform: uppercase;
  padding: .3em .6em; border-radius: 999px;
  background: var(--accent); color: var(--on-accent);
  transform: scale(.7); opacity: 0;
  animation: encIn var(--T) var(--ease-out) infinite;
}

/* the rappel, which leaves on its own */
.rap {
  position: absolute; right: 1.6em; bottom: -1.5em;
  display: flex; align-items: center; gap: .6em;
  padding: .7em .95em;
  border: 1px solid color-mix(in oklab, var(--azure-lit) 34%, transparent);
  border-radius: 999px;
  background: #12293f;
  box-shadow: 0 14px 34px -14px rgb(0 0 0 / .8);
  font-size: 1.1em; white-space: nowrap;
  opacity: 0;
  animation-name: rapFly; animation-timing-function: var(--ease-in-out);
}
.rap svg { width: 1.15em; height: 1.15em; flex: none; }
.rap svg path { fill: var(--azure-lit); }
.rap em { font-style: normal; color: var(--on-ink-muted); }

.thesis {
  margin-top: 2.1em;
  font-size: 1.5em; letter-spacing: -.01em;
  color: var(--on-ink);
  text-align: center;
  opacity: 0;
  animation-name: thesisIn; animation-timing-function: var(--ease-out);
}
.thesis b { font-weight: 400; color: var(--accent-lit); }

/* the amount that crosses from the note into the caisse */
.fly {
  position: absolute; left: 50%; top: 50%;
  z-index: 5;
  display: flex; align-items: center; gap: .5em;
  padding: .55em .9em;
  border-radius: var(--r-sm);
  background: var(--amber-lit); color: #3a1d02;
  box-shadow: 0 12px 30px -12px rgb(0 0 0 / .7);
  font-size: 1.35em; font-variant-numeric: tabular-nums; white-space: nowrap;
  opacity: 0;
  animation-name: flyPath; animation-timing-function: var(--ease-in-out);
}

/* ═══════════════════════════════════════════════════════════════════════════
   KEYFRAMES — every one authored in % of the same 14 s loop.
   Second → percent: t × 7.142857.  100% is authored identical to 0%.

   The seam is a transition like the other three, not a gap: act 1 begins
   flying in at 13.3 s, so at t = 0 the agenda is already half-arrived and the
   caisse is still dissolving behind it. That is why act 1's entry is written
   across the 97 % → 100 % → 6 % boundary instead of starting at zero.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── ground ─────────────────────────────────────────────────────────────── */
@keyframes glow1 {
  0% {opacity: 1}
  20%,38.288% {opacity: 1}
  41.712%,95.2% {opacity: 0}
  100% {opacity: 1}
}
@keyframes glow2 {
  0% {opacity: 0}
  20%,37.712% {opacity: 0}
  41.144%,58.288% {opacity: 1}
  61.712%,100% {opacity: 0}
}
@keyframes glow3 {
  0% {opacity: 0}
  20%,57.144% {opacity: 0}
  61.144%,78.288% {opacity: 1}
  81.712%,100% {opacity: 0}
}
@keyframes glow4 {
  0% {opacity: 0}
  20%,77.144% {opacity: 0}
  81.144%,94.856% {opacity: 1}
  98.856%,100% {opacity: 0}
}

/* ── HUD ────────────────────────────────────────────────────────────────── */
@keyframes cap1 {
  0% {opacity: 0;  transform: translateY(-.4rem)}
  20% {opacity: 0; transform: translateY(.45rem)}
  22.4%,39.144% {opacity: 1;  transform: translateY(0)}
  40.856% {opacity: 0;  transform: translateY(-.4rem)}
  100% {opacity: 0;  transform: translateY(-.4rem)}
}
@keyframes cap2 {
  0% {opacity: 0; transform: translateY(-.4rem)}
  20%,41.432% {opacity: 0; transform: translateY(.45rem)}
  43.712%,59.144% {opacity: 1; transform: translateY(0)}
  60.856%,100% {opacity: 0; transform: translateY(-.4rem)}
}
@keyframes cap3 {
  0% {opacity: 0; transform: translateY(-.4rem)}
  20%,61.432% {opacity: 0; transform: translateY(.45rem)}
  63.712%,79.144% {opacity: 1; transform: translateY(0)}
  80.856%,100% {opacity: 0; transform: translateY(-.4rem)}
}
@keyframes cap5 {
  0%,20%      { opacity: 1; transform: translateY(0) }
  22.4%       { opacity: 0; transform: translateY(-.4rem) }
  23%,98.6%   { opacity: 0; transform: translateY(.45rem) }
  100%        { opacity: 1; transform: translateY(0) }
}
@keyframes cap4 {
  0% {opacity: 0; transform: translateY(-.4rem)}
  20%,81.144% {opacity: 0; transform: translateY(.45rem)}
  83.432%,96.856% {opacity: 1; transform: translateY(0)}
  98.568%,100% {opacity: 0; transform: translateY(-.4rem)}
}

/* the rail unwinds right to left over the last 0.5 s, while act 1 flies in */
@keyframes railFill1 {
  0%,20% {transform: scaleX(0)}
  40%,98.6% {transform: scaleX(1); animation-timing-function: cubic-bezier(.23,1,.32,1)}
  100% {transform: scaleX(0)}
}
@keyframes railFill2 {
  0%,40% {transform: scaleX(0)}
  60%,98.6% {transform: scaleX(1); animation-timing-function: cubic-bezier(.23,1,.32,1)}
  100% {transform: scaleX(0)}
}
@keyframes railFill3 {

  80%,98.6% {transform: scaleX(1); animation-timing-function: cubic-bezier(.23,1,.32,1)}
  100% {transform: scaleX(0)}
}
@keyframes railFill4 {
  0%,80% {transform: scaleX(0)}
  97.144%,98.6% {transform: scaleX(1); animation-timing-function: cubic-bezier(.23,1,.32,1)}
  100% {transform: scaleX(0)}
}

/* ── act 1 · the agenda, arriving across the seam ───────────────────────── */
@keyframes dayIn {
  0% {opacity: 0;   transform: translateX(-1.2em); animation-timing-function: linear}
  20% {opacity: 0;  transform: translateX(-1.2em)}
  21.712%,38.568% {opacity: 1;   transform: translateX(0)}
  41.144% {opacity: 0;   transform: translateX(-1.8em)}
  44% {opacity: 0;   transform: translateX(-1.2em); animation-timing-function: linear}
  100% {opacity: 0;   transform: translateX(-1.2em); animation-timing-function: linear}
}
@keyframes hhIn {
  0% {opacity: 0;  transform: translateX(-1.4em); animation-timing-function: linear}
  20% {opacity: 0;  transform: translateX(-1.4em)}
  22.568%,38.288% {opacity: 1;  transform: translateX(0)}
  40.568% {opacity: 0;  transform: translateX(-2.4em)}
  44% {opacity: 0;  transform: translateX(-1.4em); animation-timing-function: linear}
  100% {opacity: 0;  transform: translateX(-1.4em); animation-timing-function: linear}
}
@keyframes blkIn {
  0% {opacity: 0;   transform: translate(9em, 0em) scale(.97); animation-timing-function: linear}
  20% {opacity: 0;   transform: translate(9em, 0em) scale(.97)}
  24.856%,32.856% {opacity: 1;   transform: translate(0em, 0em) scale(1)}
  34.856%,38.568% {opacity: .32; transform: translate(0em, 0em) scale(.985)}
  42% {opacity: 0;   transform: translate(var(--ox, 6em), var(--oy, 0em)) scale(.9)}
  47.2% {opacity: 0;   transform: translate(9em, 0em) scale(.97); animation-timing-function: linear}
  100% {opacity: 0;   transform: translate(9em, 0em) scale(.97); animation-timing-function: linear}
}

  0% {opacity: 0;   transform: translate(9em, 0em) scale(.97); animation-timing-function: linear}
  20% {opacity: 0;   transform: translate(9em, 0em) scale(.97)}
  24.856%,32.856% {opacity: 1;   transform: translate(0em, 0em) scale(1)}
  34.856%,38.568% {opacity: 1;   transform: translate(0em, 0em) scale(1.03)}
  40.568% {opacity: 1;   transform: translate(0em, 7.5em) scale(1.07)}
  42.288% {opacity: 0;   transform: translate(0em, 10.5em) scale(1.16)}
  47.2% {opacity: 0;   transform: translate(9em, 0em) scale(.97); animation-timing-function: linear}
  100% {opacity: 0;   transform: translate(9em, 0em) scale(.97); animation-timing-function: linear}
}
@keyframes tintIn {
  0% {transform: scaleX(0)}
  20%,25.712% {transform: scaleX(0)}
  28.568%,40% {transform: scaleX(1)}
  44%,100% {transform: scaleX(0)}
}
@keyframes barIn {
  0% {transform: scaleY(0)}
  20%,25.144% {transform: scaleY(0)}
  27.712%,40% {transform: scaleY(1)}
  44%,100% {transform: scaleY(0)}

@keyframes dotIn {

  28.288%,40% {transform: scale(1)}
  44%,100% {transform: scale(0)}

@keyframes pickIn {

  20%,32.856% {opacity: 0; transform: scale(1.07)}
  34.856%,38.856% {opacity: 1; transform: scale(1)}
  40.568% {opacity: 0; transform: scale(1.02)}

/* ── act 2 · la fiche ───────────────────────────────────────────────────── */
@keyframes cardIn {
  0% {opacity: 0; transform: translateY(1.6em) scale(.93)}
  20%,39.712% {opacity: 0; transform: translateY(1.6em) scale(.93)}
  42.288% {opacity: 1; transform: translateY(.5em) scale(.977)}
  44.856%,59.144% {opacity: 1; transform: translateY(0em) scale(1)}
  61.432% {opacity: 0; transform: translateY(-3em) scale(.965)}
  66.4%,100% {opacity: 0; transform: translateY(1.6em) scale(.93)}
}
@keyframes metaIn {
  0% {opacity: 0; transform: translateY(1em)}
  20%,51.144% {opacity: 0; transform: translateY(1em)}
  53.144%,58.568% {opacity: 1; transform: translateY(0em)}
  60.288% {opacity: 0; transform: translateY(-1em)}
  64.8%,100% {opacity: 0; transform: translateY(1em)}
}
/* the tooth numbers land with the last tooth, never before the first */
@keyframes numIn {

  20%,45.144% {opacity: 0; transform: translateY(.5em)}
  46.856%,58.568% {opacity: 1; transform: translateY(0em)}
  60.288% {opacity: 0; transform: translateY(-.6em)}
  64.8%,100% {opacity: 0; transform: translateY(.5em)}

@keyframes toothIn {

  20%,43.712% {opacity: 0; transform: translateY(.6em) scale(.86)}
  45.712%,58.568% {opacity: 1; transform: translateY(0em) scale(1)}
  60.288% {opacity: 0; transform: translateY(1.4em) scale(.8)}
  64.8%,100% {opacity: 0; transform: translateY(.6em) scale(.86)}
}
@keyframes nowIn {

  20%,48.856% {transform: scale(0)}
  51.144% {transform: scale(1.14)}
  52.288%,60% {transform: scale(1)}
  61.2%,100% {transform: scale(0)}
}

/* ── act 3 · la note ────────────────────────────────────────────────────── */
@keyframes sheetIn {
  0% {opacity: 0; transform: translateY(7em) scale(.98)}
  20%,60.288% {opacity: 0; transform: translateY(7em) scale(.98)}
  63.712%,78.856% {opacity: 1; transform: translateY(0em) scale(1)}
  82.568% {opacity: 0; transform: translateY(-2.4em) scale(.965)}
  85.6%,100% {opacity: 0; transform: translateY(7em) scale(.98)}
}
@keyframes sheetBar {
  0% {transform: scaleX(0)}
  20%,62.288% {transform: scaleX(0)}
  64.856%,80% {transform: scaleX(1)}
  84%,100% {transform: scaleX(0)}
}
@keyframes sh3In {
  0% {opacity: 0; transform: translateY(1em)}
  20%,62.856% {opacity: 0; transform: translateY(1em)}
  65.432%,78.856% {opacity: 1; transform: translateY(0em)}
  81.144% {opacity: 0; transform: translateY(-.8em)}
  84%,100% {opacity: 0; transform: translateY(1em)}
}
@keyframes lineWrite {
  0% {opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(0em)}
  20%,65.144% {opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(0em)}
  66.288% {opacity: 1; clip-path: inset(0 55% 0 0);  transform: translateX(0em)}
  68%,78.856% {opacity: 1; clip-path: inset(0 0% 0 0);   transform: translateX(0em)}
  81.432% {opacity: 0; clip-path: inset(0 0% 0 0);   transform: translateX(3.5em)}
  84%,100% {opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(0em)}
}
@keyframes totIn {
  0% {opacity: 0; transform: translateY(.9em) scale(.96)}
  20%,69.144% {opacity: 0; transform: translateY(.9em) scale(.96)}
  71.712%,78.568% {opacity: 1; transform: translateY(0em) scale(1)}
  80.288% {opacity: 0; transform: translateY(-.6em) scale(.98)}
  84%,100% {opacity: 0; transform: translateY(.9em) scale(.96)}
}
@keyframes sfootIn {
  0% {opacity: 0; transform: translateY(.8em)}
  20%,72% {opacity: 0; transform: translateY(.8em)}
  74.288%,78.856% {opacity: 1; transform: translateY(0em)}
  81.144% {opacity: 0; transform: translateY(-.6em)}
  84%,100% {opacity: 0; transform: translateY(.8em)}
}

/* the amount crossing from the note into the caisse total */
@keyframes flyPath {
  0% {opacity: 0; transform: translate(calc(-50% + var(--fx1)), calc(-50% + var(--fy1))) scale(.9)}
  20%,78.856% {opacity: 0; transform: translate(calc(-50% + var(--fx0)), calc(-50% + var(--fy0))) scale(.92)}
  80.568% {opacity: 1; transform: translate(calc(-50% + var(--fx0)), calc(-50% + var(--fy0))) scale(1)}
  82.568% {opacity: 1; transform: translate(calc(-50% + var(--fxm)), calc(-50% + var(--fym))) scale(1.04)}
  84.856% {opacity: 1; transform: translate(calc(-50% + var(--fx1)), calc(-50% + var(--fy1))) scale(1)}
  86.288%,100% {opacity: 0; transform: translate(calc(-50% + var(--fx1)), calc(-50% + var(--fy1))) scale(.9)}
}

/* ── act 4 · la caisse ──────────────────────────────────────────────────── */
@keyframes tillIn {
  0% {opacity: 0; transform: translateY(3em) scale(.96)}
  20%,79.432% {opacity: 0; transform: translateY(3em) scale(.96)}
  83.432%,95.712% {opacity: 1; transform: translateY(0em) scale(1)}
  98.856% {opacity: 0; transform: translateY(-2.6em) scale(.97)}
  99.92%,100% {opacity: 0; transform: translateY(3em) scale(.96)}
}
@keyframes sumIn {
  0% {opacity: 0; transform: translateY(.9em)}
  20%,81.712% {opacity: 0; transform: translateY(.9em)}
  84.568%,95.432% {opacity: 1; transform: translateY(0em)}
  98% {opacity: 0; transform: translateY(-.7em)}
  99.92%,100% {opacity: 0; transform: translateY(.9em)}
}
@keyframes roll {
  0% {transform: translateY(calc(var(--from) * -1.12em))}
  20%,86% {transform: translateY(calc(var(--from) * -1.12em))}
  90%,99.6% {transform: translateY(calc(var(--to) * -1.12em))}
  99.92%,100% {transform: translateY(calc(var(--from) * -1.12em))}
}
@keyframes mvIn {
  0% {opacity: 0; transform: translateX(-1.4em)}
  20%,82.568% {opacity: 0; transform: translateX(-1.4em)}
  85.432%,95.432% {opacity: 1; transform: translateX(0em)}
  98.288% {opacity: 0; transform: translateX(1.4em)}
  99.92%,100% {opacity: 0; transform: translateX(-1.4em)}
}
@keyframes hotIn {
  0% {opacity: 0; transform: scaleX(1)}
  20%,85.712% {opacity: 0; transform: scaleX(.4)}
  88%,95.432% {opacity: 1; transform: scaleX(1)}
  97.144%,100% {opacity: 0; transform: scaleX(1)}
}
@keyframes encIn {
  0% {opacity: 0; transform: scale(.9)}
  20%,88% {opacity: 0; transform: scale(.7)}
  89.712%,95.432% {opacity: 1; transform: scale(1)}
  97.144%,100% {opacity: 0; transform: scale(.9)}
}
@keyframes rapFly {
  0% {opacity: 0; transform: translate(0em, 1.2em) rotate(0deg) scale(.92)}
  20%,89.144% {opacity: 0; transform: translate(0em, 1.2em) rotate(0deg) scale(.92)}
  91.432%,93.712% {opacity: 1; transform: translate(0em, 0em) rotate(0deg) scale(1)}
  98% {opacity: 0; transform: translate(9em, -7.5em) rotate(-7deg) scale(.84)}
  99.92%,100% {opacity: 0; transform: translate(0em, 1.2em) rotate(0deg) scale(.92)}
}
@keyframes thesisIn {
  0% {opacity: 0; transform: translateY(.9em)}
  20%,92.568% {opacity: 0; transform: translateY(.9em)}
  95.432%,97.144% {opacity: 1; transform: translateY(0em)}
  98.856% {opacity: 0; transform: translateY(-.6em)}
  99.92%,100% {opacity: 0; transform: translateY(.9em)}
}


/* ── the end card · variant C, « rise & track » ──────────────────────────
   The render's clock in this loop's percentages: its t = 0 is 80 %, and one
   of its milliseconds is 1/175 %. So 950 ms (the rise) ends at 85.43 %,
   1550 ms (the letters settling) at 88.86 %, and the specular sweep runs
   1900 → 2720 ms = 90.86 → 95.54 %. What follows to 100 % is the render's
   own one-second hold on the resolved lockup — which is also 0 %. */
@keyframes endPlate {
  0%,20%      { opacity: 1 }
  22.3%,97.7% { opacity: 0 }
  100%        { opacity: 1 }
}
/* the exit: the lockup blooms outward as the agenda arrives underneath it */
@keyframes endLock {
  0%,20%      { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(.33,1,.68,1) }
  22.9%       { opacity: 0; transform: scale(1.05) }
  23.4%,99.9% { opacity: 0; transform: scale(1) }
  100%        { opacity: 1; transform: scale(1) }
}
@keyframes endMarkFade {
  0%          { opacity: 0; animation-timing-function: cubic-bezier(.33,1,.68,1) }
  2.74%,23%   { opacity: 1 }
  23.4%,100%  { opacity: 0 }
}
/* outBack(1.42) — the rise overshoots and settles, which is the whole read */
@keyframes endMarkRise {
  0%          { transform: scale(.42); animation-timing-function: cubic-bezier(.34,1.56,.64,1) }
  5.43%,23%   { transform: scale(1) }
  23.4%,100%  { transform: scale(.42) }
}
@keyframes endBloom {
  0%,1.03%    { opacity: 0 }
  4.17%       { opacity: .62 }
  7.31%,100%  { opacity: 0 }
}
@keyframes endWord {
  0%,3.43%    { opacity: 0; animation-timing-function: cubic-bezier(.33,1,.68,1) }
  7.09%,23%   { opacity: 1 }
  23.4%,100%  { opacity: 0 }
}
/* the letters start bunched at 0.78 of their tracking and open outward to 1.
   --tx is each letter's own offset at that scale, in wordmark user units. */
@keyframes endLtr {
  0%,3.43%    { transform: translateX(var(--tx)); animation-timing-function: cubic-bezier(.22,1,.36,1) }
  8.86%,23%   { transform: translateX(0) }
  23.4%,100%  { transform: translateX(var(--tx)) }
}
/* one sweep across both halves of the lockup, --sx apart in their own spaces */
@keyframes endShine {
  0%,10.86%   { opacity: 0; transform: translateX(0) }
  13.2%       { opacity: var(--sa, .9) }
  15.54%,100% { opacity: 0; transform: translateX(var(--sx)) }
}

/* ═══════════════════════════════════════════════════════════════════════════
   WIRING — which element runs which keyframe track
   ═══════════════════════════════════════════════════════════════════════════ */
.glow-1 { animation-name: glow1 }
.glow-2 { animation-name: glow2 }
.glow-3 { animation-name: glow3 }
.glow-4 { animation-name: glow4 }

.caption span:nth-child(1) { animation-name: cap1 }
.caption span:nth-child(2) { animation-name: cap2 }
.caption span:nth-child(3) { animation-name: cap3 }
.caption span:nth-child(4) { animation-name: cap4 }
/* wired by class, not by position: .cap-still already sits at nth-child(5) */
.caption span.cap-end { animation-name: cap5 }

.blk     { animation-name: blkIn }
.blk.sel { animation-name: blkSel }
.pick    { animation-duration: var(--T); animation-iteration-count: infinite; animation-fill-mode: both; animation-name: pickIn; animation-timing-function: var(--ease-out) }

/* the travelling amount: start / arc / land, in world em, per branch */
.fly { --fx0: 10.3em; --fy0: 5.15em; --fxm: 4.5em; --fym: 6.8em; --fx1: -3.1em; --fy1: -6.05em }

/* utility tracks used from the markup */
.m  { animation-name: metaIn;  animation-timing-function: var(--ease-out) }
.arch-n { animation-name: numIn; animation-timing-function: var(--ease-out) }
.s3 { animation-name: sh3In;   animation-timing-function: var(--ease-out) }


/* ═══════════════════════════════════════════════════════════════════════════
   THE END CARD — « rise & track », the brand's own animated lockup, ported
   from the delivered end-card renders (variant C) to CSS so it shares this
   file's single `--T` clock instead of drifting against it as a <video>
   would. Same geometry, same easing curves, same 3.4 s beat; vector, ~6 KB,
   and it survives `prefers-reduced-motion` because it is not a film.

   ⚠️ THE PLATE IS DEEPER THAN --ink ON PURPOSE. The lockup's gradient runs
   #1B54CE → #2FC6E0, and its dark end is only a shade off --ink (#295AA8):
   on the card's own ground the left limb of the Λ disappears. The plate dims
   the stage to a deepened blue — still the logo's blue, never a grey-navy,
   which is the two-brands problem tokens.css exists to prevent.

   ⚠️ IT IS ALSO WHAT COVERS THE HOLD. The four acts are frozen at their last
   values from 0 % to 20 %; the plate is opaque across all of it, so the freeze
   is never on screen. It closes over act 4's exit in the 0.4 s before the
   seam and lifts 0.4 s after the build resolves — the logo IS the transition
   at both ends, not a cut to one.
   ═══════════════════════════════════════════════════════════════════════════ */
.end {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  pointer-events: none;
}
.end-plate {
  position: absolute; inset: 0;
  background: radial-gradient(120% 120% at 50% 42%, #1A4380 0%, #0E2A52 72%);
  animation-name: endPlate;
}
.end-lock {
  position: relative;
  width: 48cqw;
  display: flex; flex-direction: column; align-items: center;
  animation-name: endLock;
}
/* the mark's own box, and the origin the rise scales about (62 %, not 50 %:
   the chevron's optical centre sits below its geometric one) */
.end-mark {
  position: relative;
  width: 16.2cqw;
  margin-bottom: 4.4cqw;
  transform-origin: 50% 62%;
  animation-name: endMarkFade, endMarkRise;
}
.end-word { position: relative; width: 100%; animation-name: endWord }
.end svg { display: block; width: 100%; height: auto; overflow: visible }
/* the halo behind the mark — a transient flash at the apex of the rise, gone
   by the time the word lands. A div, not the render's <radialGradient>: it
   costs one paint instead of an SVG filter region. */
.end-bloom {
  position: absolute; left: 50%; top: 44%;
  width: 230%; aspect-ratio: 1;
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side,
    rgb(127 216 245 / .55) 0%, rgb(59 160 230 / .18) 45%, rgb(59 160 230 / 0) 100%);
  animation-name: endBloom;
}
.end-ltr { animation-name: endLtr }
.end-shine { animation-name: endShine }
.end-plate, .end-lock, .end-mark, .end-word, .end-bloom, .end-ltr, .end-shine {
  animation-duration: var(--T);
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  animation-fill-mode: both;
}

/* ═══════════════════════════════════════════════════════════════════════════
   THE PHONE BRANCH — the world keeps ~10 px per em, so labels stay labels.
   Only the proportions of the stage and the density of the scene change.
   ═══════════════════════════════════════════════════════════════════════════ */
@container film (max-width: 30rem) {
  .stage { aspect-ratio: 342 / 372 }
}
@container stage (max-width: 30rem) {
  .world { font-size: calc(100cqw / 34.2) }   /* 342 design px wide */

  .only-wide { display: none }
  .only-narrow { display: inline }

  .act { padding: 1.4em }

  /* the stage is taller than it is wide here, so the lockup takes more of the
     width than the 48 % the 16:9 render used, or it reads as a sticker */
  .end-lock { width: 62cqw }
  .end-mark { width: 21cqw; margin-bottom: 5.6cqw }

  .day { margin-bottom: 1.1em }
  .day b { font-size: 1.35em }
  .day s, .day u { font-size: 1.02em }
  .row { grid-template-columns: 4.2em 1fr; gap: .7em }
  .grid { gap: .65em }
  .blk { height: 4.6em; padding: 0 .9em 0 1.3em; gap: .7em }
  .blk-t s { font-size: 1.05em }
  .blk-f { display: none }
  .row:nth-child(6) { display: none }

  .card, .sheet, .till { padding: 1.5em 1.4em 1.4em }
  .fh { gap: .8em }
  .av { width: 3em; height: 3em }
  .fh-t b { font-size: 1.5em }
  .fh-t s { font-size: 1.02em }
  .zchip { font-size: .92em; padding: .38em .7em }
  .hr { margin: 1.1em 0 1em }
  .arch-n { display: none }
  .arch-r { gap: .22em }
  .fline { font-size: 1.1em; margin-top: 1.1em }
  .fstats { margin-top: 1em; padding-top: 1em; gap: .6em }
  .fstats s { font-size: .82em }

  .sh b { font-size: 1.5em }
  .sh s, .sh u { font-size: 1em }
  .li { padding: .72em 0 }
  .li em { display: none }
  .tot { margin-top: .9em }
  .tot b { font-size: 2em }
  .tot s { font-size: 1em }
  .sfoot { font-size: 1em; margin-top: 1em; padding-top: .9em }

  .th s, .th em, .th u { font-size: .98em }
  .sum { font-size: 2.6em }
  .mv { margin-top: 1.1em; padding-top: .9em }
  .mv-r em { display: none }
  .rap { font-size: .98em; right: .9em; bottom: -1.3em; padding: .55em .8em }
  .thesis { margin-top: 1.5em }

  .fly { --fx0: 8.35em; --fy0: 4.8em; --fxm: 3.5em; --fym: 6.2em; --fx1: -2.5em; --fy1: -5.05em }

  /* Legibility floor. The world scales with the slot, so every secondary label
     eventually falls under 11 px. max() lets each one keep its proportion until
     it would cross the floor, then holds. Nothing here changes a box. */
  .lbl            { font-size: max(11px, 1em) }
  .hh             { font-size: max(11px, 1.2em) }
  .day s, .day u  { font-size: max(11px, 1.02em) }
  .blk-t s        { font-size: max(11px, 1.05em) }
  .zchip          { font-size: max(11px, .92em) }
  .fh-t s         { font-size: max(11px, 1.02em) }
  .fline u        { font-size: max(11px, .88em) }
  .fstats s       { font-size: max(11px, .82em) }
  .sh s, .sh u    { font-size: max(11px, 1em) }
  .sh u em        { font-size: max(11px, .9em) }
  .tot s          { font-size: max(11px, 1em) }
  .sfoot          { font-size: max(11px, 1em) }
  .th s, .th em, .th u { font-size: max(11px, .98em) }
  .sum .dt        { font-size: max(11px, .42em) }
  .mv-h           { font-size: max(11px, 1.02em) }
  .mv-r           { font-size: max(11px, 1.05em); margin-top: .6em; padding: .5em .6em }
  .enc            { font-size: max(11px, .8em) }
  .rap            { font-size: max(11px, .98em) }
  .fstats b       { font-size: max(11px, 1.15em) }
  .blk-t b        { font-size: max(11px, 1.3em) }
  .li             { font-size: max(11px, 1.15em) }
  .thesis         { font-size: max(11px, 1.2em) }
  .fly            { font-size: max(11px, 1.15em) }
  /* At the floor the badge pushes the patient's name into an ellipsis, and the
     name is the point of the row. The amber tint already says which one it is. */
  .mv-r .enc      { display: none }
}

/* ═══════════════════════════════════════════════════════════════════════════
   REDUCED MOTION — not a frozen frame and not an empty box: a composed still
   that carries the whole argument at once. The day, coloured; the fiche with
   the act recorded on 26; the note it produced; the money already in; the
   recall already gone. The rail reads as finished, the caption is the claim.
   ═══════════════════════════════════════════════════════════════════════════ */
.still { display: none }
.cap-still { display: none !important }

@media (prefers-reduced-motion: reduce) {
  .film *, .film *::before, .film *::after { animation: none !important; transition: none !important }

  .act, .fly, .end { display: none !important }
  .caption span { display: none !important }
  .caption span.cap-still { display: flex !important; opacity: 1 !important; transform: none !important }
  .rail > i::after { transform: scaleX(1) !important }

  .glow-1 { opacity: .55 !important }
  .glow-4 { opacity: .5 !important }

  .still { display: grid !important }
  .still .blk, .still .arch-r i, .still .mv-r, .still .rap,
  .still .card, .still .enc, .still .fline, .still .fstats div,
  .still .day, .still .hh { opacity: 1 !important; transform: none !important }
  .still .blk::before { transform: scaleX(1) !important }
  .still .blk::after  { transform: scaleY(1) !important }
  .still .blk-d       { transform: scale(1) !important }
  .still .now::after  { transform: scale(1) !important }
}

.still {
  position: absolute; inset: 0;
  padding: 2.2em;
  grid-template-columns: 21em 1fr;
  align-items: center;
  gap: 1.7em;
}
.still .grid { gap: .7em }
.still .row { grid-template-columns: 4.2em 1fr; gap: .7em }
.still .blk { height: 4.4em }
.still .blk-f { display: none }
.still .card { max-width: none }
.still .note-strip {
  display: flex; align-items: center; gap: .7em;
  margin-top: 1.3em; padding-top: 1.2em; border-top: 1px solid var(--rule);
  font-size: 1.2em;
}
.still .note-strip i { flex: none; width: .7em; height: .7em; border-radius: 50%; background: var(--amber) }
.still .note-strip b { font-weight: 400; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.still .rap { position: static; margin-top: 1.1em; align-self: start; width: fit-content }

@container stage (max-width: 30rem) {
  .still { grid-template-columns: 1fr; align-content: center; gap: .85em; padding: 1.4em }
  .still .row:nth-child(4) { display: none }
  .still .grid { gap: .6em }
  .still .day { margin-bottom: .8em }
  .still .blk { height: 3.5em }
  .still .note-strip { margin-top: 1em; padding-top: .9em; font-size: 1.1em }
  .still .arch-r:nth-child(2) { display: none }
  .still .fstats { display: none }
  .still .rap { display: none }
}

body { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
.host { width: min(636px, 100%); }
