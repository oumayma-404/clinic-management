<!-- One page, so every nav target is a section of index.html. {{HOME}} is "" on the home page
     (a same-document jump) and "index.html" everywhere else. -->
<header class="topbar {{BARCLASS}}">
  <div class="wrap topbar-in">

    <a class="brand" href="{{ROOT}}index.html" aria-label="APEXA">
      <span class="mark" aria-hidden="true">
        {{MARK}}
      </span>
      {{WORD}}
    </a>

    <nav class="nav" aria-label="Principal">
      <a href="{{HOME}}#dossier" data-nav="dossier">Le dossier</a>
      <a href="{{HOME}}#argent" data-nav="argent">L’argent</a>
      <a href="{{HOME}}#mobile" data-nav="mobile">Mobile</a>
      <a href="{{HOME}}#faq" data-nav="faq">Questions</a>
      <a href="{{HOME}}#telecharger" data-nav="telecharger">Installer</a>
    </nav>

    <div class="topbar-cta">
      <a class="btn btn-ghost" href="{{HOME}}#demande">Demander une démo</a>
      <a class="btn btn-primary" href="{{HOME}}#telecharger">Essayer gratuitement</a>
    </div>

    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="drawer">
      <span class="sr-only">Ouvrir le menu</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<div class="drawer" id="drawer" data-open="false">
  <div class="wrap drawer-top">
    <a class="brand" href="{{ROOT}}index.html" aria-label="APEXA">
      <span class="mark" aria-hidden="true">
        {{MARK}}
      </span>
      {{WORD}}
    </a>
    <button class="burger" id="drawer-close" type="button" style="margin-inline-start:auto">
      <span class="sr-only">Fermer le menu</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="wrap drawer-body">
    <nav aria-label="Menu">
      <a href="{{HOME}}#dossier">Le dossier</a>
      <a href="{{HOME}}#argent">L’argent</a>
      <a href="{{HOME}}#avant-avec">Le quotidien</a>
      <a href="{{HOME}}#mobile">Mobile</a>
      <a href="{{HOME}}#faq">Questions</a>
      <a href="{{HOME}}#telecharger">Installer</a>
    </nav>
    <div class="drawer-actions">
      <a class="btn btn-primary" href="{{HOME}}#telecharger">Essayer gratuitement</a>
      <a class="btn btn-ghost" href="{{HOME}}#demande">Demander une démo</a>
    </div>
  </div>
</div>
