# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Builds the Windows client installer that « Mettre à jour maintenant » in the desktop shell downloads.
#
# ⚠️ WHY THIS EXISTS. Shipping a shell update used to require finding a Windows machine with the .NET SDK, Node,
# PostgreSQL binaries and Inno Setup 6 on it, and hand-editing a version literal in three files. `packaging/`'s
# own header says the installers are « committed-but-not-executed » — and the cost of that was measured: both
# `.iss` files went months without a compile and the SERVER one had stopped building outright, so no clinic could
# have been sent an update at all and nothing anywhere said so. A release is now a tag.
#
# ⚠️ THIS BUILDS THE CLIENT INSTALLER ONLY, and that is a deliberate scope rather than a shortcut. The server
# installer bundles PostgreSQL 16 and a Node runtime — third-party payloads this workflow will not fabricate
# (`publish-server.ps1` takes `-PostgresDir`/`-NodeDir` for exactly that reason) — and it is ~112 MB. The client
# installer needs only the shell.
#
# ⚠️ WHAT THIS ARTIFACT IS FIT FOR: **updating a PC that already runs the shell**, which is what the shell's own
# updater fetches. It bundles neither the WebView2 offline runtime nor the server's `ca.crt` (both are
# `skipifsourcedoesntexist` in the `.iss`), because a machine being updated already has them from its first
# install. A **first** install on a fresh PC still wants the operator build — see
# `packaging/README.md` § « Shipping an update to installed clients ».
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
name: Client installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (N.N.N). Overrides the tag. Leave empty on a tag push to use the tag's own version."
        required: false
        type: string
  push:
    # A tag, never a branch: an installer per commit to `desktop/**` would be noise, and the version is a
    # deliberate act (it is what the server's client floor is compared against).
    tags:
      - "client-v*"

permissions:
  contents: read

jobs:
  installer:
    name: Build ClinicManagementClientSetup
    # ⚠️ Windows is not a preference here: ISCC.exe is Windows-only, and the shell is `net8.0-windows` + WPF.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ⚠️ **THE TAG IS THE RELEASE.** `client-v1.1.0` builds 1.1.0 — the number is stamped into the shell
      # assembly (`/p:Version`), into both installer filenames (`/DAppVersion`) and into the artifact name from
      # that one place. Precedence is: a dispatch input, else the tag, else the shell .csproj.
      #
      # Why the tag and not the .csproj, having started the other way round: the assembly version is what the
      # server's client floor is compared against, so shipping new code under the version already installed is
      # invisible — every PC compares equal, no strip appears, and the conclusion is « the updater is broken »
      # rather than « nobody bumped a file ». Making the release act *be* the version removes the step there was
      # to forget.
      #
      # ⚠️ The .csproj is still **rewritten in the workspace** (never committed) so the compiler, the installer
      # and the artifact cannot disagree — and a mismatch is reported, because after this the .csproj value is a
      # development default rather than a statement about any release, and a stale one should be visible.
      # `Resolve-Version` still validates the shape: an unparseable floor value silently disables the floor.
      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          $csproj = 'desktop/ClinicManagement.DesktopShell/ClinicManagement.DesktopShell.csproj'

          $src = Get-Content packaging/publish-server.ps1 -Raw
          $start = $src.IndexOf('function Resolve-Version')
          $end = $src.IndexOf('$Version = Resolve-Version')
          Invoke-Expression $src.Substring($start, $end - $start)

          # What the .csproj currently claims, for the mismatch note below.
          $declared = Resolve-Version '' $csproj

          $explicit = '${{ inputs.version }}'
          $origin = 'the dispatch input'
          if (-not $explicit -and '${{ github.ref_type }}' -eq 'tag') {
            # client-v1.1.0 -> 1.1.0
            $explicit = '${{ github.ref_name }}' -replace '^client-v', ''
            $origin = "the tag ${{ github.ref_name }}"
          }
          if (-not $explicit) {
            $origin = 'the shell .csproj'
          }

          $resolved = Resolve-Version $explicit $csproj
          "version=$resolved" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $resolved (from $origin)"

          if ($resolved -ne $declared) {
            "note=The shell .csproj declares $declared; this release is $resolved (from $origin)." >> $env:GITHUB_OUTPUT
            Write-Warning "The shell .csproj declares <Version>$declared</Version> but this release is $resolved. Stamping $resolved."
            # Rewritten in the workspace only, so `dotnet publish` and ISCC agree with the artifact's name.
            $xml = Get-Content $csproj -Raw
            $xml = $xml -replace '<Version>[^<]*</Version>', "<Version>$resolved</Version>"
            Set-Content -LiteralPath $csproj -Value $xml -Encoding utf8
          }
          else {
            "note=" >> $env:GITHUB_OUTPUT
          }

      - name: Publish the shell (self-contained win-x64)
        shell: pwsh
        run: |
          dotnet publish desktop/ClinicManagement.DesktopShell/ClinicManagement.DesktopShell.csproj `
            -c Release -r win-x64 --self-contained true `
            /p:UseAppHost=true `
            /p:Version=${{ steps.version.outputs.version }} `
            -o packaging/build-output/client/shell
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      # The `.iss` comment traps this repo has already paid for twice — cheap, and it fails before the 4-minute
      # compile rather than after it.
      - name: Lint the .iss comments
        shell: pwsh
        run: node packaging/lint-iss.mjs

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }

          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "packaging/client/clinic-client.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # ⚠️ The SHA-256 is printed and attached, because the shell verifies the download against the hash the
      # server publishes and an operator hosting this file themselves has to be able to state it. Where the
      # clinic server serves its own bundled copy the hash is computed from the bytes instead — see
      # `ClientUpdatePackage`.
      - name: Report what was built
        id: report
        shell: pwsh
        run: |
          $exe = Get-ChildItem packaging/build-output/ClinicManagementClientSetup-*.exe |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "No installer was produced" }

          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $mb = [math]::Round($exe.Length / 1MB, 1)

          "## Client installer $($exe.Name)"                       >> $env:GITHUB_STEP_SUMMARY
          ""                                                        >> $env:GITHUB_STEP_SUMMARY
          "| | |"                                                   >> $env:GITHUB_STEP_SUMMARY
          "|---|---|"                                               >> $env:GITHUB_STEP_SUMMARY
          "| Version | ``${{ steps.version.outputs.version }}`` |"  >> $env:GITHUB_STEP_SUMMARY
          "| Size | $mb MB |"                                       >> $env:GITHUB_STEP_SUMMARY
          "| SHA-256 | ``$hash`` |"                                 >> $env:GITHUB_STEP_SUMMARY
          ""                                                        >> $env:GITHUB_STEP_SUMMARY
          if ('${{ steps.version.outputs.note }}') {
            "> [!NOTE]"                                             >> $env:GITHUB_STEP_SUMMARY
            "> ${{ steps.version.outputs.note }}"                    >> $env:GITHUB_STEP_SUMMARY
            ""                                                      >> $env:GITHUB_STEP_SUMMARY
          }
          "Fit for **updating** an existing install. A first install on a fresh PC wants the operator build (no WebView2 runtime or ``ca.crt`` is bundled here)." >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: ClinicManagementClientSetup-${{ steps.version.outputs.version }}
          path: packaging/build-output/ClinicManagementClientSetup-*.exe
          if-no-files-found: error
          retention-days: 90
