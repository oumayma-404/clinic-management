# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Releases the Android shell: builds a SIGNED release APK and puts it in the hosted deployment's `updates/`
# folder, where `GET /api/meta/client-download/android` serves it. Installed phones (1.5.0 and later) then see
# « Une nouvelle version est disponible » and update in two taps — see `features/android-in-app-update`.
#
# The Android twin of `client-installer.yml`, and deliberately shaped like it: same triggers, same version
# derivation, same « publish, THEN tag » order.
#
# ⚠️ THE SIGNING KEY. Android refuses an update signed by a different key than the installed app, so every
# release must be signed with the key the phones' current APK was signed with (`clinic-pilot.jks`). Losing it
# means no installed phone can ever update again. It reaches this job only through the four ANDROID_* secrets,
# and the job FAILS rather than publish an unsigned or debug-signed APK — either would be refused on every phone.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (N.N.N). Overrides everything else."
        required: false
        type: string
  push:
    # A shell change landing on `main` IS a release, as for the desktop shell: a version is derived and the tag
    # written back by this workflow.
    branches:
      - main
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-release.yml"
    tags:
      - "android-v*"

permissions:
  # `write` because the job pushes the `android-v<version>` tag it just built.
  contents: write

# Two releases at once would derive the same version and race on one file in `updates/`.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build + publish the signed APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android

    steps:
      # `fetch-depth: 0`: the next version is derived from the newest `android-v*` tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Precedence: a dispatch input, else the tag, else the newest `android-v*` tag with its patch bumped, else
      # the default in `app/build.gradle.kts`. Patch and never minor: this runs unattended and must not invent a
      # claim about the size of a change — push `android-v1.3.0` by hand for that.
      - name: Resolve the version
        id: version
        run: |
          declared=$(sed -n 's/.*gradleProperty("shellVersion").getOrElse("\([0-9.]*\)").*/\1/p' app/build.gradle.kts)
          version='${{ inputs.version }}'
          origin='the dispatch input'

          if [ -z "$version" ] && [ '${{ github.ref_type }}' = 'tag' ]; then
            version='${{ github.ref_name }}'
            version="${version#android-v}"
            origin='the tag ${{ github.ref_name }}'
          fi

          if [ -z "$version" ] && [ '${{ github.ref_type }}' = 'branch' ]; then
            latest=$(git tag --list 'android-v*' | sed 's/^android-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -n "$latest" ]; then
              IFS=. read -r major minor patch <<< "$latest"
              version="$major.$minor.$((patch + 1))"
              origin="the newest tag android-v$latest, bumped"
            else
              # Never below what is already installed: the Gradle default is the first updater build.
              version="$declared"
              origin='app/build.gradle.kts (no android-v tag exists yet)'
            fi
          fi

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::Version '$version' is not N.N.N (minor and patch 0-99, see versionCodeOf)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (from $origin)"

      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The ANDROID_* signing secrets are not set. An unsigned APK cannot update any phone."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # ⚠️ Phone notifications (staff-chat) are compiled in only when `app/google-services.json` exists at build
      # time, and the file is git-ignored — so without this secret every released APK would quietly ship with
      # notifications off, on phones that had them. Optional only so a first release is not blocked on Firebase.
      - name: Install the Firebase config (phone notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON is not set: this APK has phone notifications OFF."
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build the release APK
        run: ./gradlew --no-daemon assembleRelease -PshellVersion=${{ steps.version.outputs.version }}

      # A release that built unsigned (the keystore block is optional by design) must never be published.
      - name: Check the APK is signed
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed release APK was produced."; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk"
          mkdir -p ../../build
          cp "$apk" "../../build/APEXA-${{ steps.version.outputs.version }}.apk"

      # ⚠️ Uploaded under a `.part` name and RENAMED on the server: the API offers the newest `APEXA-x.y.z.apk`,
      # so a half-copied file under its final name would be offered to every phone, and refused by each of them.
      - name: Publish to the hosted deployment
        if: ${{ vars.VPS_HOST != '' }}
        working-directory: .
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::VPS_SSH_KNOWN_HOSTS is empty - refusing to publish without a pinned host key."
            exit 1
          fi

          # StrictHostKeyChecking stays ON: this publishes code the clinics' phones will install.
          opts="-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"
          target='${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}'
          dir='${{ vars.VPS_DEPLOY_DIR }}/updates'

          scp $opts "build/APEXA-$VERSION.apk" "$target:$dir/APEXA-$VERSION.apk.part"
          ssh $opts "$target" "mv -f '$dir/APEXA-$VERSION.apk.part' '$dir/APEXA-$VERSION.apk'"

      # Written LAST, and only on the branch path: the tag is what the next run derives from.
      - name: Tag this release
        if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
        run: |
          tag="android-v${{ steps.version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Push a higher android-v tag by hand to re-release."
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"

      - uses: actions/upload-artifact@v4
        with:
          name: APEXA-android-${{ steps.version.outputs.version }}
          path: build/APEXA-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove the signing material
        if: always()
        run: rm -f release.jks keystore.properties app/google-services.json ~/.ssh/id_deploy
