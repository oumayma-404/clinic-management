# The backend and frontend gate — the one this repository did not have.
#
# Until this file, `.github/workflows/` held exactly one workflow (the iOS shell's), so nothing built `api/` or
# `web/` on a push. That mattered for two reasons beyond the usual. **The unit suite is the only automated check
# the backend has** — there is no integration test and nothing touches a database — and it was being run by hand
# on a Windows machine where Smart App Control intermittently refuses freshly-built test assemblies, which makes
# "the suite is green" a claim nobody could cheaply verify. And **`web/` has no test runner and no working
# ESLint**, so `tsc --noEmit` + `check:responsive` + `next build` are not a subset of its gate, they ARE its gate
# (`.claude/rules/frontend-web.md` says so); running them anywhere other than a developer's memory is new.
#
# ⚠️ Six jobs, deliberately independent rather than one matrix: they share no toolchain (dotnet / node / JDK),
# and a failure should name which stack broke without reading a log. `desktop` and `android` are the shells' only
# static gates and have never run outside the author's machine; neither can be a *complete* gate, because both
# products' real verification is a walk on hardware — see `desktop/CLAUDE.md` and `mobile/CLAUDE.md`.
#
# ⚠️ `mobile/ios/` is NOT here: it needs a macOS runner, which is billed on private repositories, so it keeps its
# own path-filtered workflow and its own decision about when to spend that.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless. Cancel it rather than queue it — but
# never on the default branch, where each commit's result is a record rather than a preview.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    name: API — build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Restore separately so a dependency failure is not reported as a compile error.
      - name: Restore
        run: dotnet restore api/ClinicManagement.sln

      # ⚠️ `--no-restore`, never `--no-build` on the test step below: a stale assembly passing is worse than no
      # gate at all, and this repo has been bitten by exactly that.
      - name: Build
        run: dotnet build api/ClinicManagement.sln --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test api/ClinicManagement.UnitTests/ClinicManagement.UnitTests.csproj
          --configuration Release --no-build --logger "trx;LogFileName=api-tests.trx"

      - name: Upload test results
        if: always() # The results matter most when the step above failed.
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

  web:
    name: Web — typecheck + responsive + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # The three checks `.claude/rules/frontend-web.md` names, in its order. Typecheck first: it is the fastest
      # and the one whose failure makes the other two meaningless.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Responsive rules
        run: npm run check:responsive

      - name: Build
        run: npm run build

  # The vendor console (platform-console Part 1) — a SECOND Next application, held to exactly the `web` job's
  # gate above. Its own job rather than a matrix entry with `web`, for the same reason the four existing jobs are
  # separate: a failure should name the stack without anyone reading a log, and these two share no lockfile.
  #
  # ⚠️ It runs the console's OWN `scripts/check-responsive.mjs`. That file is a copy of `web`'s with two
  # documented differences (the agenda check deleted, the inherited card-fallback exemptions emptied), and the
  # copy is deliberate: two applications in one repository held to one device contract is the point, and a
  # symlink or a shared script would have to grow a per-app branch at the first divergence.
  packaging:
    # ⚠️ This does NOT compile the installers — ISCC needs Windows + Inno Setup 6, so the real compile stays
    # an operator step (README.md § « Shipping an update to installed clients »). What it catches is the one
    # failure mode that is invisible without running ISCC: a `{ }` comment whose own `}` closes it early. Both
    # .iss files went months uncompiled and the SERVER installer had stopped building outright — so a clinic
    # could not have been sent an update, and nothing anywhere said so.
    name: Packaging — Inno Setup comment traps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint .iss comments
        run: node packaging/lint-iss.mjs

  console:
    name: Console — typecheck + responsive + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Responsive rules
        run: npm run check:responsive

      - name: Build
        run: npm run build

  # Known-vulnerable dependencies, across all three package graphs. Until this job, NOTHING in this repository
  # scanned anything: `SECURITY_REVIEW_2026-08.md`'s own « Scope and limits » names a dependency-vulnerability scan
  # as one of three open items, and the other two (dynamic testing, a penetration test) cannot be automated here.
  # This one can, so it is a gate rather than a note.
  #
  # ⚠️ Its own job for the same reason the five above are separate: three toolchains, and a failure should name
  # which package graph is affected without anyone reading a log.
  #
  # ⚠️ `--include-transitive` on the .NET side is the whole point — a direct dependency is visible in a .csproj and
  # gets noticed; a transitive one three levels down is exactly what nobody is tracking.
  #
  # ⚠️ `dotnet list package --vulnerable` exits **0 even when it finds something** (it is a reporting verb, not a
  # gate), so the output is grepped and the step fails on a hit. Without that grep this job is decorative — the
  # failure shape `SECURITY_ARCHITECTURE.md` § 9.7 calls « present and inert ». `set -o pipefail` matters too, or
  # a crashed dotnet reads as clean.
  #
  # ⚠️ `npm audit` DOES exit non-zero, and deliberately at `--audit-level=high`: a moderate advisory in a
  # transitive dev-only build dependency must not be able to block a clinical bug fix from shipping. High and
  # critical do.
  dependencies:
    name: Dependencies — known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore (api)
        run: dotnet restore api/ClinicManagement.sln

      - name: Audit NuGet packages
        shell: bash
        run: |
          set -o pipefail
          dotnet list api/ClinicManagement.sln package --vulnerable --include-transitive \
            | tee nuget-audit.txt
          if grep -qiE '^\s*>\s|has the following vulnerable packages' nuget-audit.txt; then
            echo "::error title=Vulnerable NuGet package::See the report above."
            exit 1
          fi
          echo "No known-vulnerable NuGet packages."

      # `npm audit` needs no install — it reads the lockfile — so this is fast and cannot be broken by a
      # postinstall script. `--omit=dev` is deliberately NOT passed: the build toolchain runs on CI and on
      # developer machines, and a compromised build dependency reaches the shipped bundle.
      - name: Audit web packages
        working-directory: web
        run: npm audit --audit-level=high

      - name: Audit console packages
        working-directory: console
        run: npm audit --audit-level=high

  desktop:
    name: Desktop shell — build + test
    # Windows-only by construction: net8.0-windows + WPF. The *shell* cannot be run here (no WebView2 runtime),
    # so for it this proves compilation and nothing more. What CAN be run is the pure logic beside it —
    # `MirrorPathPlanner`, which decides where every mirrored patient file lands and is the one place a silent
    # mistake would overwrite one patient's radiograph with another's.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build desktop/ClinicManagement.DesktopShell.sln --configuration Release

      - name: Test
        run: dotnet test desktop/ClinicManagement.DesktopShell.sln --configuration Release --no-build

  android:
    name: Android shell — lint + assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Lint runs with `warningsAsErrors`, and it is the module's ONLY static gate — there is no test source set.
      - name: Lint
        run: ./gradlew --no-daemon lint

      # ⚠️ Gradle prints « Lint found N errors. First failure: … » and then only the FIRST one, so errors 2..N
      # never reach the log and the HTML artifact has to be downloaded to read them. That gap cost a full round
      # trip diagnosing a red build whose second error nobody could see. The text report carries all of them.
      # `find` rather than a literal path: the intermediates directory is AGP-version-specific.
      - name: Show the full lint report on failure
        if: failure()
        run: find app/build -name 'lint-results-*.txt' -print -exec cat {} \; || true

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            mobile/android/app/build/reports/lint-results-*.html
            mobile/android/app/build/intermediates/**/lint-results-*.txt
          if-no-files-found: warn

  # The hot-path end-to-end gate — the one thing neither `api` nor `web` can possibly cover.
  #
  # ⚠️ **`api`'s unit suite structurally cannot see any of this.** `api/CLAUDE.md` says it in as many words:
  # nothing in `UnitTests` touches a database, so a migration is the one change unit tests cannot verify — and
  # by the same token neither can a *coupled read*. Every tier-0 scenario here is « this figure is right on the
  # screen you touched and wrong on the four you did not »: a fiche's payment reaching la caisse on the séance's
  # own day, a plan dropped whole from « Créances » by the devis→note bridge, an odontogram asserting an implant
  # from a step 1 of 2. Those are facts about the *database and the reads over it*, and the only way to hold them
  # is to run the product.
  #
  # ⚠️ **And `web`'s gate cannot see the client half.** `tsc --noEmit` + `check:responsive` + `next build` all
  # passed while every `Completed` treatment plan threw during render and its workspace showed nothing
  # (`primaryAction`, a `useMemo` calling a `const` declared below it). Only a browser saw it. That scenario is
  # `PLAN-01` in this suite.
  #
  # ── What it costs, and why that is acceptable ──
  # ~4 minutes on a `ubuntu-latest` runner: postgres + minio as services, one API, one `next build` + `start`,
  # then ~65 tests at one worker. It is the slowest job in this file and the only one that can catch a money
  # defect.
  #
  # ⚠️ **`workers: 1` is set in `playwright.config.ts` and must stay there.** Half of what this asserts is a
  # *clinic-wide* read — la caisse's day total, « Créances », the dashboard's counts — so two tests billing a
  # fiche concurrently make each other's expected figure wrong. Parallelising this suite does not make it fast,
  # it makes it lie.
  e2e:
    name: E2E — hot paths (money · fiche · devis)
    runs-on: ubuntu-latest
    # Nothing is gained by running it against a tree that does not compile, and a 4-minute job that was always
    # going to fail is 4 minutes of everyone's afternoon.
    needs: [api, web]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinic_user
          POSTGRES_PASSWORD: clinic_password
          POSTGRES_DB: clinic_management
        ports: ["5432:5432"]
        # Without a health check the API races the database and fails its first migration.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # ⚠️ **There is deliberately NO MinIO here, and the first version of this job had one that broke the run.**
      #
      # `bitnami/minio:latest` no longer exists — Bitnami stopped publishing those tags, so the pull fails with
      # « manifest unknown » and the job dies before a single test runs. That was this job's very first red.
      #
      # The right fix turned out to be removing it rather than replacing it: **nothing this suite asserts touches
      # object storage.** File upload and the DICOM/mesh viewers are explicitly out of scope
      # (`features/e2e-hot-paths/findings.md` § 6), `IFileStorage` and `IMinioClient` are both registered as lazy
      # factories so the API starts without anything listening, and `HealthCheckTests` already pins that
      # unreachable storage is reported **Degraded** — which still answers `/health` 200, so the readiness poll
      # below is unaffected.
      #
      # ⚠️ If a future scenario does need storage, note why a service container is the wrong shape for it and why
      # someone reached for Bitnami in the first place: the official `minio/minio` image requires
      # `server /data` as its command, and GitHub's `services:` cannot set a container's command. Run it as an
      # ordinary step instead —
      #     docker run -d -p 9000:9000 -e MINIO_ROOT_USER=… -e MINIO_ROOT_PASSWORD=… \
      #       --name minio minio/minio server /data
      # — which also lets you wait for it properly instead of trusting a health flag.

    env:
      # `Development` is required, not convenient: a non-Development environment REFUSES to start without real
      # MinIO credentials, an encrypted Data Protection key ring and verified internal transport — see
      # `Program.cs`'s startup diagnostics. Those are the right refusals and this job must not weaken them, so it
      # runs the environment they are relaxed for.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=clinic_management;Username=clinic_user;Password=clinic_password"
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
      API_INTERNAL_URL: "http://localhost:5000/api"

      # ⚠️ **The rate limiter is LOOSENED here, and only here.** `RateLimiting.cs` exposes these keys in as many
      # words — « so an unusually busy cabinet can be loosened » — and a suite that arranges its own
      # preconditions is by far the busiest client the API will ever see: ~70 tests, several writes each, plus a
      # `/bff/auth/token` exchange (which is an `/api/auth/*` call) on **every** browser navigation. The auth
      # window's real default is 30 attempts per five minutes per account, which a person mistyping a password
      # never approaches and this suite passes in about ninety seconds.
      #
      # The limits are not being *tested* away: the burst is an artefact of the harness, not of the product, and
      # a 429 mid-run reads exactly like a broken endpoint. `ClinicApi` still honours `Retry-After` on top of
      # this, so a genuine limit is still handled rather than hidden.
      # The clinic's day runs 23:00Z -> 22:59:59Z, and `ClinicClock` is the only thing that knows it. The
      # BROWSER's timezone is set in playwright.config.ts, but the test process computes « today » with
      # `new Date()` in Node -- so on a UTC runner, between 23:00 and midnight UTC the runner's today and the
      # clinic's day are DIFFERENT DATES, and every `arrange.localDay(0)` would query the wrong caisse window.
      # One line, and the whole suite agrees with the product about what day it is.
      TZ: Africa/Tunis

      RateLimiting__Auth__PermitLimit: "2000"
      RateLimiting__Auth__AddressPermitLimit: "5000"
      RateLimiting__Api__PermitLimit: "5000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── The API. Starting it is also what APPLIES THE MIGRATIONS, and the order matters: `provision-clinic`
      #    intercepts before the web host boots, so run alone on an empty database it fails with
      #    « relation "Users" does not exist ». Measured, on the first attempt at this.
      - name: Build the API
        run: dotnet build api/ClinicManagement.API/ClinicManagement.API.csproj -c Release

      - name: Start the API (applies migrations)
        run: |
          dotnet run --project api/ClinicManagement.API -c Release --no-build --no-launch-profile \
            > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health --max-time 3 || true)
            [ "$code" != "000" ] && { echo "api up: $code"; exit 0; }
            sleep 2
          done
          echo "::error title=API did not start::last 80 lines follow"; tail -80 /tmp/api.log; exit 1

      # ── The clinic and its first administrator, through the product's own operator verb.
      - name: Provision a clinic
        id: provision
        run: |
          out=$(dotnet run --project api/ClinicManagement.API -c Release --no-build --no-launch-profile -- \
            provision-clinic --name "Cabinet E2E" --admin-email e2e.runner@cabinet-e2e.tn \
            --admin-name "Dr E2E Runner" --city Tunis)
          echo "$out"
          # The verb prints « Temporary password: <value> » — the one value the next step cannot derive.
          pw=$(echo "$out" | sed -n 's/.*Temporary password:[[:space:]]*//p' | tr -d '\r' | head -1)
          [ -n "$pw" ] || { echo "::error title=No temporary password in provision-clinic output::"; exit 1; }
          echo "::add-mask::$pw"
          echo "temp_password=$pw" >> "$GITHUB_OUTPUT"

      # ── Enrol the second factor, spend the one-time password, seed the catalogue. Writes
      #    CLINIC_EMAIL / CLINIC_PASSWORD / CLINIC_TOTP_SECRET / CLINIC_ID into $GITHUB_ENV.
      #
      #    ⚠️ It is slow on purpose (~90 s): a TOTP code is single-use and the auth endpoints are rate-limited,
      #    so each step waits for a fresh 30-second window instead of retrying inside one.
      - name: Bootstrap the account and the catalogue
        run: node e2e/bootstrap.mjs --temp-password "${{ steps.provision.outputs.temp_password }}"

      # ── The frontend. A PRODUCTION build, not `next dev`: `next dev` degrades over a long session (measured —
      #    a Turbopack worker died after 11 hours and every page rendered « Jest worker encountered 2 child
      #    process exceptions », which reads as a product crash), and the CSP that gates `blob:` workers only
      #    exists in a real build.
      - name: Install web
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      # ⚠️ **NOT `npm run start`, and the difference is a whole suite's worth of false failures.**
      # `next.config.ts` sets `output: 'standalone'`, and with that configuration `next start` prints
      # « "next start" does not work with "output: standalone" configuration », **binds anyway**, reports
      # « Ready in 630ms », serves a few requests — and then exits silently with no error.
      #
      # Measured 2026-09-11 on a full local run: the readiness poll below went green, ~35 tests passed, and the
      # server then vanished. Every later browser test failed with `net::ERR_CONNECTION_REFUSED`, which the
      # report renders as ten product defects — seven `XCUT-09` scrollbar failures, `PLAN-04`, `EDIT-06`,
      # `EDIT-07`. Nothing in the log says the server died; you only find it by reading a failure's own message.
      #
      # The standalone server is the runner this build actually produces. It needs `static` and `public` beside
      # it — `next build` deliberately does not copy them, because the Docker image does it in its own layer.
      - name: Start web
        working-directory: web
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3000 node .next/standalone/server.js > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login --max-time 5 || true)
            [ "$code" = "200" ] && { echo "web up"; exit 0; }
            sleep 2
          done
          echo "::error title=Web did not start::last 60 lines follow"; tail -60 /tmp/web.log; exit 1

      # ⚠️ A readiness poll proves the server answered ONCE. This proves it is still there after the build and
      # install steps that follow — the exact window in which `next start` used to disappear.
      - name: Web is still up
        working-directory: web
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login --max-time 5 || true)
          [ "$code" = "200" ] || { echo "::error title=Web died after starting::$code"; tail -60 /tmp/web.log; exit 1; }

      - name: Install the suite
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # ── Does the suite still cover the catalogue? Runs BEFORE the suite, because it needs no stack and a
      #    coverage regression is worth knowing in fifteen seconds rather than after fifteen minutes.
      #
      # ⚠️ **`--report` — reported, not gated, and that is temporary.** Measured 2026-09-11, the day this check
      # was written: 47 of the catalogue's tier-0 rows had no test at all and 17 more were covered only on the
      # wire while their rule lives in the browser. Gating on that would make every push red for a backlog
      # nobody can clear in one commit, and a check that is always red is a check people learn to scroll past.
      #
      # **Drop `--report` once `e2e/specs/` closes the tier-0 backlog** — the whole point of the script is that
      # the day it can be a gate is a measurable date, not an opinion. Until then the numbers are in the log and
      # they only ever move one way.
      - name: Scenario coverage (reported)
        if: always()
        run: node e2e/scripts/check-coverage.mjs --report

      # `channel: "chrome"` in the config is right for a developer's machine; CI has the bundled Chromium.
      - name: Run the hot-path suite
        working-directory: e2e
        env:
          CLINIC_E2E_BROWSER_CHANNEL: ""
        run: npx playwright test

      # ── The two read-only console verbs, AFTER the suite has written to every ledger it touches. This is the
      #    check `.claude/rules/verification.md` names for a money change and it costs seconds: exit 0 clean,
      #    1 could-not-run, 2 drift found.
      # ⚠️ **Reported, not gated — and that is a deliberate weakening with a stated reason.** `verify-schema`
      # answers two different questions under one exit code: « does the live schema match the model » (which is
      # what matters, and what `deploy-hosted.yml` still gates on strictly against the real database) and « have
      # the data-migration and daily-pass invariants been satisfied », which a clinic that has existed for four
      # minutes cannot satisfy. `messaging-month-covers-every-clinic` is the clear case: it reports drift until
      # the daily pass has run, and that pass runs at 06:00 Tunis. Gating here would make the job red on every
      # push for a reason that is true of the fixture and false of the product.
      #
      # The exit code is surfaced in the summary so a *schema* drift is still visible to anyone reading the run.
      - name: verify-schema (reported)
        if: always()
        shell: bash
        run: |
          set +e
          dotnet run --project api/ClinicManagement.API -c Release --no-build --no-launch-profile -- verify-schema \
            | tee /tmp/verify-schema.txt
          code=$?
          set -e
          {
            echo "### verify-schema — exit $code"
            echo ""
            echo '```'
            grep -E '^\s*\[DRIFT\]' /tmp/verify-schema.txt || echo "no drift"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) echo "Schema and data-migration invariants both clean." ;;
            2) echo "::warning title=verify-schema found drift::Read the summary. On a database this job just created, the data-migration checks legitimately drift; a schema line here is worth chasing." ;;
            *) echo "::error title=verify-schema could not run::exit $code"; exit 1 ;;
          esac

      # ⚠️ **This one IS a gate, unlike the check above it.** Every dinar on this database was put there by the
      # suite minutes ago, so the ledgers have no history to excuse a discrepancy: drift here means a money path
      # the tests exercised does not add up, which is exactly what the suite exists to catch.
      - name: reconcile-money
        if: always()
        shell: bash
        run: |
          set +e
          dotnet run --project api/ClinicManagement.API -c Release --no-build --no-launch-profile -- reconcile-money
          code=$?
          set -e
          case "$code" in
            0) echo "Money reconciles." ;;
            2) echo "::error title=reconcile-money found DRIFT::A money path the suite exercised does not add up."; exit 1 ;;
            *) echo "::error title=reconcile-money could not run::exit $code"; exit 1 ;;
          esac

      - name: Upload the report, traces and screenshots
        if: always() # They matter most when the step above failed.
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/.artifacts/report
            e2e/.artifacts/results.json
            e2e/.artifacts/**/*.png
            e2e/.artifacts/**/trace.zip
          if-no-files-found: warn

      - name: Upload the server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            /tmp/api.log
            /tmp/web.log
          if-no-files-found: warn
